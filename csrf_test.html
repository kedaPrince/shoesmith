<!DOCTYPE html>
<html>
<head>
    <title>Security Test - FIXED VERSION</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Security Tests - SIMPLE VERSION</h1>
    
    <div class="test">
        <h3>XSS Test</h3>
        <button onclick="runXssTest()">Run XSS Test</button>
        <div id="xssResult"></div>
    </div>

    <script>
        // SIMPLE CORRECT VERSION
        async function runXssTest() {
            document.getElementById('xssResult').innerHTML = 'Testing...';
            
            // CORRECT ARRAY - NO SYNTAX ERRORS
            const xssPayloads = [
                "test1",
                "test2",
                "test3"
            ];
            
            console.log("Testing with payloads:", xssPayloads);
            
            let results = [];
            for (let payload of xssPayloads) {
                results.push(`Tested: ${payload}`);
            }
            
            document.getElementById('xssResult').innerHTML = 
                `<pre>${results.join('\n')}</pre>`;
        }
    </script>
</body>
</html>
